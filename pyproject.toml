[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipboy-os"
version = "1.0.15"
description = "Pip-Boy OS - A Fallout interface built with Python and Pygame."
readme = "README.md"
authors = [{ name = "DanieleM" }]
license = { text = "MIT" } 
dependencies = [
    "numpy>=2.0.0",
    "Pillow>=11.0.0",
    "pygame-ce>=2.5.5",
    "Requests>=2.32.3",
    "tinytag>=1.10.1",
    "smbus2>=0.4.2; sys_platform != 'win32'",
    "gpiozero>=1.6.2; sys_platform != 'win32'"
]

[project.scripts]
pipboy-os = "pip_boy_os.modules.main:main"
pipboy-os-setup = "pip_boy_os.modules.setup_assets:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pip_boy_os*"]

[tool.setuptools.package-data]
"pip_boy_os" = [
    "fonts/*.ttf"
]
"pip_boy_os.modules" = [
    "*.ini"
]
"pip_boy_os.modules.cpp" = [
    "*.pyd",
    "*.so"
]